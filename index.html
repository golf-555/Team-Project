<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Design - ແນະນຳສາຂາ</title>
<style>
* { box-sizing: border-box; scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fc;
  color: #26334a;
}

header {
  background: #10264a;
  color: white;
  padding: 20px 8%;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

nav h2 { color: #60c7ff; }

nav a {
  color: white;
  text-decoration: none;
  margin: 8px;
}

.hero {
  text-align: center;
  padding: 75px 15px;
  background: linear-gradient(135deg,#10264a,#1767a5);
  color: white;
}

.hero h1 { font-size: 38px; }

.hero p {
  font-size: 18px;
  line-height: 1.8;
}

.btn {
  display: inline-block;
  background: #35b6f5;
  color: white;
  padding: 13px 25px;
  border-radius: 8px;
  text-decoration: none;
  margin-top: 15px;
}

.container {
  max-width: 1050px;
  margin: auto;
  padding: 30px 18px;
}

.section {
  background: white;
  padding: 25px;
  margin: 20px 0;
  border-radius: 14px;
  box-shadow: 0 3px 15px #00000010;
}

h2 { color: #1767a5; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 18px;
}

.item {
  background: #edf5ff;
  padding: 20px;
  border-radius: 12px;
}

.item h3 { color: #1767a5; }
