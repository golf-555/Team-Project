                    <p class="text-slate-400 text-sm leading-relaxed">
                        ນັກພັດທະນາສ່ວນສະແດງຜົນ ເນັ້ນສ້າງໜ້າຕາເວັບໄຊໃຫ້ງາມ ໂຕ້ຕອບໄດ້ດີ ແລະ ຮອງຮັບມືຖື.
                    </p>
                </div>

                <!-- Job Card 2 -->
                <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl hover:border-purple-500/50 transition duration-300">
                    <div class="w-12 h-12 bg-purple-500/10 rounded-xl flex items-center justify-center text-purple-400 text-xl mb-4">
                        <i class="fa-solid fa-server"></i>
                    </div>
                    <h3 class="font-bold text-lg text-white mb-2">Back-End Developer</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">
                        ນັກພັດທະນາລະບົບເບື້ອງຫຼັງ ເນັ້ນການຈັດການຖານຂໍ້ມູນ, ຄວາມປອດໄພ ແລະ API.

                        ຜູ້ຊ່ຽວຊານທີ່ສາມາດເຮັດໄດ້ທັງ Front-End ແລະ Back-End ໃນຄົນດຽວ (ເປັນທີ່ຕ້ອງການຫຼາຍ).

                </div>

                <!-- Job Card 4 -->
                <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl hover:border-amber-500/50 transition duration-300">
                    <div class="w-12 h-12 bg-amber-500/10 rounded-xl flex items-center justify-center text-amber-400 text-xl mb-4">
                        <i class="fa-solid fa-pen-ruler"></i>
                    </div>
                    <h3 class="font-bold text-lg text-white mb-2">UI/UX Designer</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">
                        ນັກອອກແບບໜ້າຕາ ແລະ ວິເຄາະ ປະສົບການຜູ້ໃຊ້ ເພື່ອໃຫ້ແອັບ/ເວັບ ໃຊ້ງານງ່າຍທີ່ສຸດ.

        <!-- Interactive Quiz Section -->
        <section id="quiz" class="py-16 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-10">
                <div class="text-center mb-8">
                    <span class="text-xs font-semibold uppercase tracking-wider text-blue-400">Knowledge Check</span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-white mt-1">ແບບທົດສອບຄວາມຮູ້ສັ້ນໆ (Quick Quiz)</h2>
                </div>

                <div id="quiz-container">
                    <div class="mb-6">
                        <h3 id="quiz-question" class="text-lg font-semibold text-white mb-4">
                            1. ພາສາໃດທີ່ໃຊ້ສຳລັບຈັດໂຄງສ້າງຫຼັກຂອງເວັບໄຊ (Structure)?
                        </h3>
                        <div id="quiz-options" class="space-y-3">
                            <button onclick="checkAnswer(0)" class="quiz-opt w-full text-left p-4 rounded-xl bg-slate-950 border border-slate-800 hover:border-blue-500 transition text-sm text-slate-300">
                                A. CSS
                            </button>
                            <button onclick="checkAnswer(1)" class="quiz-opt w-full text-left p-4 rounded-xl bg-slate-950 border border-slate-800 hover:border-blue-500 transition text-sm text-slate-300">
                                B. HTML
                            </button>
                            <button onclick="checkAnswer(2)" class="quiz-opt w-full text-left p-4 rounded-xl bg-slate-950 border border-slate-800 hover:border-blue-500 transition text-sm text-slate-300">

    <footer class="border-t border-slate-800 py-8 px-4 text-center text-slate-500 text-sm">

    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Tab Switching Logic
        function switchTab(tabId) {
            // Hide all tab panes
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.add('hidden');
            });
            
            // Deactivate all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');
                btn.classList.add('bg-slate-900', 'text-slate-400');
            });

            // Show selected pane & activate button
            document.getElementById('content-' + tabId).classList.remove('hidden');
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.remove('bg-slate-900', 'text-slate-400');
            activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');
        }

        // Live Playground Logic
        let currentColor = 'bg-blue-600';
        let hasShadow = false;

        function updateDemo() {
            const val = document.getElementById('demo-text-input').value;
            document.getElementById('demo-heading').innerText = val || "ສະບາຍດີ!";
        }

        function changeColor(colorClass) {
            const btn = document.getElementById('demo-button');
            btn.classList.remove(currentColor);
            btn.classList.add(colorClass);
            currentColor = colorClass;
        }

        function toggleShadow() {
            const card = document.getElementById('demo-card');
            hasShadow = !hasShadow;
            if (hasShadow) {
                card.classList.add('shadow-2xl', 'shadow-blue-500/20', 'border-blue-500/50');
            } else {
                card.classList.remove('shadow-2xl', 'shadow-blue-500/20', 'border-blue-500/50');
            }
        }

        // Quiz Logic
        const questions = [
            {
                q: "1. ພາສາໃດທີ່ໃຊ້ສຳລັບຈັດໂຄງສ້າງຫຼັກຂອງເວັບໄຊ (Structure)?",
                options: ["A. CSS", "B. HTML", "C. JavaScript"],
                correct: 1
            },
            {
                q: "2. ເຄື່ອງມືໃດທີ່ນິຍົມໃຊ້ໃນການອອກແບບ UI/UX ທັງໂຄງຮ່າງ ແລະ ໜ້າຕາ?",
                options: ["A. Figma", "B. MySQL", "C. Node.js"],
                correct: 0
            },
            {
                q: "3. ຕຳແໜ່ງໃດທີ່ຮັບຜິດຊອບທັງ Front-End ແລະ Back-End?",
                options: ["A. UI Designer", "B. Database Admin", "C. Full-Stack Developer"],
                correct: 2
            }
        ];

        let currentQ = 0;
        let score = 0;

        function checkAnswer(optIndex) {
            const resultDiv = document.getElementById('quiz-result');
            resultDiv.classList.remove('hidden');

            if (optIndex === questions[currentQ].correct) {
                score++;
                resultDiv.className = "p-4 rounded-xl text-center font-medium text-sm bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-4";
                resultDiv.innerText = "✨ ຖືກຕ້ອງແລ້ວ!";
            } else {
                resultDiv.className = "p-4 rounded-xl text-center font-medium text-sm bg-rose-500/10 text-rose-400 border border-rose-500/20 mb-4";
                resultDiv.innerText = "❌ ຍັງບໍ່ຖືກຕ້ອງ!";
            }

            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    loadQuestion();
                } else {
                    showFinalScore();
                }
            }, 1200);
        }

        function loadQuestion() {
            const resultDiv = document.getElementById('quiz-result');
            resultDiv.classList.add('hidden');

            const qData = questions[currentQ];
            document.getElementById('quiz-question').innerText = qData.q;
            
            const optionsDiv = document.getElementById('quiz-options');
            optionsDiv.innerHTML = '';
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "quiz-opt w-full text-left p-4 rounded-xl bg-slate-950 border border-slate-800 hover:border-blue-500 transition text-sm text-slate-300";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                optionsDiv.appendChild(btn);
            });
        }

        function showFinalScore() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="text-center py-6">
                    <div class="text-4xl mb-3">🎉</div>
                    <h3 class="text-xl font-bold text-white mb-2">ສຳເລັດແບບທົດສອບ!</h3>
                    <p class="text-slate-300 text-sm mb-6">ທ່ານໄດ້ຄະແນນ ${score} / ${questions.length}</p>
                    <button onclick="resetQuiz()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-6 py-2.5 rounded-lg transition font-medium">
                        ທົດສອບໃໝ່ອີກຄັ້ງ
                    </button>
                </div>
            `;
        }

        function resetQuiz() {
            currentQ = 0;
            score = 0;
            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="mb-6">
                    <h3 id="quiz-question" class="text-lg font-semibold text-white mb-4"></h3>
                    <div id="quiz-options" class="space-y-3"></div>
                </div>
                <div id="quiz-result" class="hidden p-4 rounded-xl text-center font-medium text-sm"></div>
            `;
            loadQuestion();
        }
    </script>
</body>
</html>
