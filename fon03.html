<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຂໍ້ມູນການຕິດຕໍ່ - Contact Info</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Lao', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        /* Left Side: Info */
        .contact-info {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: #fff;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .contact-info h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .contact-info p {
            color: #e0e6ed;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .info-item i {
            font-size: 18px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .social-links a {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s;
        }

        .social-links a:hover {
            background: #ffffff;
            color: #0d6efd;
        }

        /* Right Side: Form */
        .contact-form {
            padding: 40px 30px;
        }

        .contact-form h3 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #495057;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #0d6efd;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0d6efd;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <!-- ຝ່າຍຂໍ້ມູນຕິດຕໍ່ -->
        <div class="contact-info">
            <div>
                <h2>ຂໍ້ມູນຕິດຕໍ່</h2>
                <p>ທ່ານສາມາດຕິດຕໍ່ຫາພວກເຮົາໄດ້ຜ່ານช่องທາງລຸ່ມນີ້:</p>

                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>ນະຄອນຫຼວງວຽງຈັນ, ສປປ ລາວ</span>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>contact@example.com</span>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>+856 20 1234 5678</span>
                </div>
            </div>

            <div>
                <p style="margin-bottom: 8px;">ຕິດຕາມພວກເຮົາ:</p>
                <div class="social-links">
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>
        </div>

        <!-- ຝ່າຍຟອມສົ່ງຂໍ້ຄວາມ -->
        <div class="contact-form">
            <h3>ສົ່ງຂໍ້ຄວາມຫາພວກເຮົາ</h3>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">ຊື່ ແລະ ນາມສະກຸນ</label>
                    <input type="text" id="name" name="name" placeholder="ນ້ຳຝົນ ຫຼ້າມະນີ" required>
                </div>

                <div class="form-group">
                    <label for="email">ອີເມວ</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">ຂໍ້ຄວາມ</label>
                    <textarea id="message" name="message" rows="4" placeholder="ພິມຂໍ້ຄວາມຂອງທ່ານຢູ່ທີ່ນີ້..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">ສົ່ງຂໍ້ຄວາມ</button>
            </form>
        </div>
    </div>

</body>
</html>
